<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kue MA – UD Fikri</title>
  <link rel="icon" href="images/faveicon.png">

  <meta name="description" content="Pesan Kue MA UD Fikri. Harga Rp500 per kue, mudah & cepat.">
  <link rel="canonical" href="https://ud-fikri.vercel.app/kue-ma.html">

  <!-- CSS utama (PAKAI YANG SAMA) -->
  <link rel="stylesheet" href="css/kue-ma.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div id="logo-container">
    <img src="images/logo.png" alt="Logo" width="70">
    <h1>KUE MA – UD FIKRI</h1>
  </div>
</header>

<!-- ===== STATUS TOKO ===== -->
<section id="store-status">
  <div id="store-status-msg" class="store-status"></div>
</section>

<!-- ===== KONTEN ===== -->
<section class="container" style="padding:15px;">

  <div class="card">
    <h2>🍰 Pesan Kue MA</h2>
    <p style="margin-bottom:10px;">Harga: <strong>Rp 500 / pcs</strong></p>

    <div class="nominal-grid">
      <button class="btn-nominal" data-nominal="5000">Rp 5.000<br><small>10 kue</small></button>
      <button class="btn-nominal" data-nominal="10000">Rp 10.000<br><small>20 kue</small></button>
      <button class="btn-nominal" data-nominal="20000">Rp 20.000<br><small>40 kue</small></button>
    </div>

    <label>Nominal manual</label>
    <input type="number" id="nominal" placeholder="Minimal 5000">

    <div class="result-box">
      <p>Jumlah Kue: <strong id="jumlah-kue">0</strong> pcs</p>
      <p>Total: <strong id="total-harga">Rp 0</strong></p>
    </div>
  </div>

  <div class="card">
    <label><i class="fa-solid fa-user"></i> Nama Pemesan</label>
    <input type="text" id="nama" placeholder="Nama anda">

    <label><i class="fa-solid fa-location-dot"></i> Alamat</label>
    <input type="text" id="alamat" placeholder="Alamat lengkap">

    <label>Catatan (opsional)</label>
    <textarea id="catatan" rows="2"></textarea>

    <button id="pesan-kue" class="btn-primary">
      <i class="fa-solid fa-cart-shopping"></i> Pesan Sekarang
    </button>
  </div>

</section>

<footer>&copy; 2025 Ikmal Falahi. All Rights Reserved.</footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/kue-ma.js"></script>
</body>
</html>
