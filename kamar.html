<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/faveicon.png">

  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://unpkg.com https://cdn.jsdelivr.net;
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' https://cdnjs.cloudflare.com;
  font-src 'self' https://cdnjs.cloudflare.com;
  ">

  <title>Kamar Toko | UD-Fikri</title>

  <link rel="stylesheet" href="css/kamar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="admin-header">
  <h1>KAMAR TOKO SEMBAKO UD-FIKRI</h1>
  <button id="logoutBtn" class="btn btn-logout">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>
</header>

<!-- ================= CONTAINER ================= -->
<div class="container">

  <!-- ================= STATUS BAR ================= -->
  <section class="status-bar">
    <div>
      <div id="admin-status" class="store-status">
        Memuat status layanan...
      </div>
      <small id="tanggalOtomatis"></small>
    </div>

    <div class="buttons">
      <button id="btnOpen" class="btn btn-open">
        🟢 Buka Layanan
      </button>
      <button id="btnClose" class="btn btn-close">
        🔴 Tutup Layanan
      </button>
    </div>
  </section>

  <!-- ================= CONTENT ================= -->
  <main class="admin-content">

    <h2>Pesanan Masuk</h2>

    <div class="table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Layanan</th>
            <th>Provider</th>
            <th>Nominal</th>
            <th>Total</th>
            <th>Status</th>
            <th>Tanggal</th>
            <th>Bukti</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="orderTable"></tbody>
          <tr>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

</div>

<footer>&copy; 2025 Ikmal Falahi. All Rights Reserved.</footer>

<!-- ================= SCRIPT ================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/kamar.js"></script>

<!-- ================= TANGGAL OTOMATIS ================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const el = document.getElementById("tanggalOtomatis");
  if (el) {
    const now = new Date();
    const options = {
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric"
    };
    el.textContent = "Tanggal: " + now.toLocaleDateString("id-ID", options);
  }
});
</script>

<!-- ================= LOGIN GUARD ================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const isLoggedIn =
    localStorage.getItem("admin_logged_in") === "true" ||
    sessionStorage.getItem("admin_logged_in") === "true";

  if (!isLoggedIn) {
    window.location.replace("login.html");
  }
});
</script>
  
</body>
</html>
