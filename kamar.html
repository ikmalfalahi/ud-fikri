   <script>
  document.addEventListener("DOMContentLoaded", () => {
    // Cek apakah admin sudah login
    const isLoggedIn =
      localStorage.getItem("admin_logged_in") === "true" ||
      sessionStorage.getItem("admin_logged_in") === "true";

    console.log("Login status:", isLoggedIn); // Debug

    if (!isLoggedIn) {
      console.warn("Belum login, mengarahkan ke login.html...");
      window.location.replace("login.html");
      return;
    }

    console.log("Sudah login, tetap di halaman kamar.html");
  });
</script>

  <script>
