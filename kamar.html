<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
default-src 'self';
connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://unpkg.com https://cdn.jsdelivr.net;
script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
style-src 'self' https://cdnjs.cloudflare.com;
font-src 'self' https://cdnjs.cloudflare.com;
">

  <title>kamar-udfikri</title>
  <link rel="stylesheet" href="css/kamar.css">
</head>
<body>

  <div class="container">
    <h1>KAMAR UD-FIKRI</h1>
    <div id="admin-status" class="store-status">Memuat status...</div>

    <div class="buttons">
      <button id="btnOpen" class="btn btn-open">🟢 Buka Toko</button>
      <button id="btnClose" class="btn btn-close">🔴 Tutup Toko</button>
    </div>

    <button id="logoutBtn" class="btn btn-logout">🚪 Logout</button>
  </div>

  <div id="store-status"></div>

  <!-- SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script> <!-- membuat window.supabase -->
<script src="js/kamar.js"></script>       <!-- pakai window.supabase -->

  <!-- CEK LOGIN -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const isLoggedIn =
        localStorage.getItem("admin_logged_in") === "true" ||
        sessionStorage.getItem("admin_logged_in") === "true";

      if (!isLoggedIn) {
        console.warn("Belum login, mengarahkan ke login.html...");
        window.location.replace("login.html");
      }
    });
  </script>

</body>
</html>
