<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://unpkg.com https://cdn.jsdelivr.net;
  script-src-elem 'self' https://cdn.jsdelivr.net;
  style-src-elem 'self' https://cdnjs.cloudflare.com;
  font-src 'self' https://cdnjs.cloudflare.com;
  img-src 'self' https://www.svgrepo.com https://cdn.jsdelivr.net;
">

  <title>Login Admin | UD Fikri</title>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="icon" type="image/png" href="images/logo.png" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
     <h2>Selamat Datang Kembali 👋</h2>
      <p>Masuk ke akun admin UD Fikri</p>
      
      <!-- NOTIFIKASI LOGIN -->
      <div id="loginMsg" class="login-msg" style="display:none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <input type="email" id="email" placeholder="Alamat Email" required />
        </div>

        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Masukkan kata sandi" />
          <button type="button" class="toggle-pass" id="togglePassword">Tampilkan</button>
        </div>

        <div class="form-options">
          <label><input type="checkbox" id="remember"> Ingat saya</label>
          <a href="#" class="forgot-link">Lupa sandi?</a>
        </div>

        <button type="submit" class="btn-login">Masuk</button>

        <p class="signup-text">Gunakan akun pengurus yang telah didaftarkan pada Supabase Authentication.</p>
      </form>
    </div>
  </div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script> <!-- wajib sebelum JS lain -->
<script src="js/login.js"></script> <!-- atau login.js, kamar.js, dll -->

</body>
</html>
