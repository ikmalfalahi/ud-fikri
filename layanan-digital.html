<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layanan Digital | UD Fikri</title>
  <link rel="stylesheet" href="css/layanan-digital.css">
</head>
<body>

<div class="page">

  <!-- HEADER -->
  <div class="hero">
    <h1>Layanan Bank & Digital</h1>
    <p>UD Fikri • Cepat • Aman • Terpercaya</p>
  </div>

  <!-- GRID LAYANAN -->
  <div class="service-grid">
    <div onclick="openService('pulsa')">📞<span>Pulsa</span></div>
    <div onclick="openService('data')">📶<span>Paket Data</span></div>
    <div onclick="openService('token')">⚡<span>Token PLN</span></div>
    <div onclick="openService('pln')">💡<span>Tagihan PLN</span></div>
    <div onclick="openService('bpjs')">🏥<span>BPJS</span></div>
    <div onclick="openService('telkom')">☎️<span>Telkom</span></div>
    <div onclick="openService('ewallet')">💳<span>E-Wallet</span></div>
    <div onclick="openService('multi')">📄<span>Multifinance</span></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>

    <select id="provider"></select>
    <select id="nominal"></select>

    <input type="text" id="inputData" placeholder="Nomor / ID Pelanggan">

    <button onclick="sendWA()">Pesan via WhatsApp</button>
    <button class="close" onclick="closeModal()">Tutup</button>
  </div>
</div>

<script src="js/layanan-digital.js"></script>
</body>
</html>
