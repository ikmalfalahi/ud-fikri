name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install fast-glob xmlbuilder2

      - name: Generate sitemap based on folder structure
        run: |
          node << 'EOF'
          import fg from "fast-glob";
          import { create } from "xmlbuilder2";
          import fs from "fs";

          const baseUrl = "https://ud-fikri.vercel.app";

          // Cari file HTML HANYA di root
          const pages = fg.sync(["*.html"]);

          const urlset = {
            urlset: {
              "@xmlns": "http://www.sitemaps.org/schemas/sitemap/0.9",
              url: pages.map((file) => ({
                loc: `${baseUrl}/${file === "index.html" ? "" : file}`,
                changefreq: "weekly",
                priority: file === "index.html" ? "1.0" : "0.8"
              }))
            }
          };

          const xml = create(urlset).end({ prettyPrint: true });
          fs.writeFileSync("sitemap.xml", xml);

          console.log("Sitemap generated from root folder!");
          EOF

      - name: Upload sitemap artifact
        uses: actions/upload-artifact@v3
        with:
          name: sitemap
          path: sitemap.xml
